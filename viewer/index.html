\t// Remove possible \"-\"\n\tif len(s) > 0 && s[0] == '-' {\n\t\ts = s[1:]\n\t}\n\t// If decimal produced \"-0\" etc\n\tif s == \"\" {\n\t\ts = \"0\"\n\t}\n\tif len(s) > width {\n\t\ts = s[len(s)-width:]\n\t}\n\tif len(s) < width {\n\t\ts = strings.Repeat(\"0\", width-len(s)) + s\n\t}\n\treturn s\n}\n\nfunc formatEdited(value decimal.Decimal, picture string) string {\n\tdotPos := strings.Index(picture, \".\")\n\tintPlaceCount := 0\n\tdecPlaceCount := 0\n\tif dotPos == -1 {\n\t\tfor _, ch := range picture {\n\t\t\tif ch == 'Z' || ch == '9' {\n\t\t\t\tintPlaceCount++\n\t\t\t}\n\t\t}\n\t} else {\n\t\tfor i, ch := range picture {\n\t\t\tif ch == 'Z' || ch == '9' {\n\t\t\t\tif i < dotPos {\n\t\t\t\t\tintPlaceCount++\n\t\t\t\t} else {\n\t\t\t\t\tdecPlaceCount++\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\n\tsignNeg := value.Sign() < 0\n\tabsVal := value\n\tif signNeg {\n\t\tabsVal = absVal.Neg()\n\t}\n\tabsValTrunc := absVal.Truncate(int32(decPlaceCount))\n\tscaledTrunc := absValTrunc.Shift(int32(decPlaceCount)).Truncate(0)\n\ttotalDigits := intPlaceCount + decPlaceCount\n\tmod := pow10Decimal(totalDigits)\n\tif scaledTrunc.Cmp(mod) >= 0 {\n\t\tscaledTrunc = scaledTrunc.Mod(mod)\n\t}\n\tvar integerPart decimal.Decimal\n\tvar decimalPart decimal.Decimal\n\tif decPlaceCount > 0 {\n\t\tpowDec := pow10Decimal(decPlaceCount)\n\t\tintegerPart = scaledTrunc.Div(powDec).Truncate(0)\n\t\tdecimalPart = scaledTrunc.Mod(powDec)\n\t} else {\n\t\tintegerPart = scaledTrunc\n\t\tdecimalPart = decimal.NewFromInt(0)\n\t}\n\n\tintStr := formatIntWithLeadingZeros(integerPart, intPlaceCount)\n\tdecStr := formatIntWithLeadingZeros(decimalPart, decPlaceCount)\n\n\t// fill output with digits\n\toutput := make([]rune, len(picture))\n\tfor i, ch := range picture {\n\t\toutput[i] = ch\n\t}\n\tpInt := 0\n\tpDec := 0\n\tfor i, ch := range picture {\n\t\tif ch == 'Z' || ch == '9' {\n\t\t\tif dotPos == -1 || i < dotPos {\n\t\t\t\tif pInt < len(intStr) {\n\t\t\t\t\toutput[i] = rune(intStr[pInt])\n\t\t\t\t\tpInt+ \tvar b strings.Builder\n\tfor _, ch := range t {\n\t\tif ch >= '0' && ch <= '9' {\n\t\t\tb.WriteRune(ch)\n\t\t} else if ch == '-' {\n\t\t\tb.WriteRune(ch)\n\t\t}\n\t}\n\tts := b.String()\n\tif ts == \"\" {\n\t\treturn 0\n\t}\n\tv, _ = strconv.ParseInt(ts, 10, 64)\n\treturn v\n}\n\nfunc formatCount(c int64) string {\n\treturn fmt.Sprintf(\"%05d\", c)\n}\n\n// paragraph functions\n\nfunc OpenLoanFile() {\n\tf, err := os.Open(\"input.dat\")\n\tif err != nil {\n\t\t// treat missing as empty to still produce summary\n\t\tif os.IsNotExist(err) {\n\t\t\tloanFile = nil\n\t\t\tscanner = nil\n\t\t\treturn\n\t\t}\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n\tloanFile = f\n\tscanner = bufio.NewScanner(f)\n\t// allow larger lines\n\tbuf := make([]byte, 0, 64*1024)\n\tscanner.Buffer(buf, 1024*1024)\n}\n\nfunc CloseLoanFile() {\n\tif loanFile != nil {\n\t\tloanFile.Close()\n\t}\n}\n\nfunc ReadPara() {\n\tif scanner == nil {\n\t\tWsEofFlag = \"Y\"\n\t\treturn\n\t}\n\tif scanner.Scan() {\n\t\tline := scanner.Text()\n\t\tif len(line) < 21 {\n\t\t\tline = line + strings.Repeat(\" \", 21-len(line))\n\t\t} else if len(line) > 21 {\n\t\t\tline = line[:21]\n\t\t}\n\t\tloanRec.LrAcct = line[0:6]\n\t\tloanRec.LrPrincipal = parseDecimalField(line[6:15], 2)\n\t\tloanRec.LrRate = parseDecimalField(line[15:19], 2)\n\t\tloanRec.LrYears = parseIntField(line[19:21])\n\t} else {\n\t\tif err := scanner.Err(); err != nil {\n\t\t\tfmt.Fprintln(os.Stderr, err)\n\t\t\tos.Exit(1)\n\t\t}\n\t\tWsEofFlag = \"Y\"\n\t}\n}\n\nfunc ProcessPara() {\n\t// COMPUTE WS-INTEREST ROUNDED = LR-PRINCIPAL * LR-RATE * LR-YEARS / 100\n\tyearsDec := decimal.NewFromInt(loanRec.LrYears)\n\traw := loanRec.LrPrincipal.Mul(loanRec.LrRate).Mul(yearsDec).Shift(-2)\n\trounded := raw.Round(2)\n\tWsInterest = applyOverflow(rounded, 9, 2)\n\n\t// ADD WS-INTEREST TO WS-TOTAL\n\tsum := WsTotal.Add(WsInterest)\n\t// truncate to scale of WS-TOTAL (2)\n\tsumTrunc := sum.Truncate(2)\n\tWsTotal = applyOverflow(sumTrunc, 11, 2)\n\n\t// ADD 1 TO WS-COUNT\n\tWsCount = (WsCount + 1) % 100000\n\n\t// MOVE LR-PRINCIPAL TO WS-PRIN-ED\n\tWsPrinEd = formatEdited(loanRec.LrPrincipal, \"Z,ZZZ,ZZ9.99\")\n\t// MOVE WS-INTEREST TO WS-INT-ED\n\tWsIntEd = formatEdited(WsInterest, \"ZZZ,ZZZ,ZZ9.99\")\n\n\t// DISPLAY LR-ACCT \" \" WS-PRIN-ED \" \" WS-INT-ED\n\tfmt.Printf(\"%s %s %s\\n\", loanRec.LrAcct, WsPrinEd, WsIntEd)\n\n\t// PERFORM READ-PARA\n\tReadPara()\n}\n\nfunc SummaryPara() {\n\tWsTotalEd = formatEdited(WsTotal, \"ZZ,ZZZ,ZZZ,ZZ9.99\")\n\tfmt.Printf(\"RECORDS: %s\\n\", formatCount(WsCount))\n\tfmt.Printf(\"TOTAL INTEREST: %s\\n\", WsTotalEd)\n}\n\nfunc MainPara() {\n\tOpenLoanFile()\n\tReadPara()\n\tfor !inputDone() {\n\t\tProcessPara()\n\t}\n\tCloseLoanFile()\n\tSummaryPara()\n}\n\nfunc main() {\n\tMainPara()\n}\n"}, "cobol": "      * SIMPLE-INTEREST BATCH (tier 1)\n      * Reads fixed-width loan records from input.dat and prints one\n      * line per loan plus a summary. Written for this hackathon.\n      * Record layout (21 bytes): ACCT X(6) | PRINCIPAL 9(7)V99 |\n      *                           RATE 9(2)V99 (percent) | YEARS 9(2)\n       IDENTIFICATION DIVISION.\n       PROGRAM-ID. SIMPLEINT.\n\n       ENVIRONMENT DIVISION.\n       INPUT-OUTPUT SECTION.\n       FILE-CONTROL.\n           SELECT LOAN-FILE ASSIGN TO \"input.dat\"\n               ORGANIZATION IS LINE SEQUENTIAL.\n\n       DATA DIVISION.\n       FILE SECTION.\n       FD  LOAN-FILE.\n       01  LOAN-REC.\n           05 LR-ACCT        PIC X(6).\n           05 LR-PRINCIPAL   PIC 9(7)V99.\n           05 LR-RATE        PIC 9(2)V99.\n           05 LR-YEARS       PIC 9(2).\n\n       WORKING-STORAGE SECTION.\n       01  WS-EOF-FLAG       PIC X       VALUE \"N\".\n           88 INPUT-DONE                 VALUE \"Y\".\n       01  WS-INTEREST       PIC 9(9)V99 VALUE 0.\n       01  WS-TOTAL          PIC 9(11)V99 VALUE 0.\n       01  WS-COUNT          PIC 9(5)    VALUE 0.\n       01  WS-PRIN-ED        PIC Z,ZZZ,ZZ9.99.\n       01  WS-INT-ED         PIC ZZZ,ZZZ,ZZ9.99.\n       01  WS-TOTAL-ED       PIC ZZ,ZZZ,ZZZ,ZZ9.99.\n\n       PROCEDURE DIVISION.\n       MAIN-PARA.\n           OPEN INPUT LOAN-FILE\n           PERFORM READ-PARA\n           PERFORM PROCESS-PARA UNTIL INPUT-DONE\n           CLOSE LOAN-FILE\n           PERFORM SUMMARY-PARA\n           STOP RUN.\n\n       READ-PARA.\n           READ LOAN-FILE\n               AT END SET INPUT-DONE TO TRUE\n           END-READ.\n\n       PROCESS-PARA.\n           COMPUTE WS-INTEREST ROUNDED =\n               LR-PRINCIPAL * LR-RATE * LR-YEARS / 100\n           ADD WS-INTEREST TO WS-TOTAL\n           ADD 1 TO WS-COUNT\n           MOVE LR-PRINCIPAL TO WS-PRIN-ED\n           MOVE WS-INTEREST TO WS-INT-ED\n           DISPLAY LR-ACCT \" \" WS-PRIN-ED \" \" WS-INT-ED\n           PERFORM READ-PARA.\n\n       SUMMARY-PARA.\n           MOVE WS-TOTAL TO WS-TOTAL-ED\n           DISPLAY \"RECORDS: \" WS-COUNT\n           DISPLAY \"TOTAL INTEREST: \" WS-TOTAL-ED.\n           "}, {"program": "discount_calc", "provider": "meta", "model": "muse-spark-1.3", "effort": "default", "sample": 0, "status": "verified", "single_shot_ok": true, "repairs_used": 0, "attempts": [{"n": 0, "kind": "translate", "cost_usd": 0.02673225, "list_cost_usd": 0.02673225, "cached": false, "output_tokens": 5817, "built": true, "passed_cases": 5, "failure": ""}], "total_cost_usd": 0.026732, "risk_features": ["EDITED-OUTPUT", "ROUNDED"], "warnings": [], "cases": 5, "total_list_cost_usd": 0.026732, "attempt_go": {"attempt_0.go": "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"strings\"\n\n\t\"github.com/shopspring/decimal\"\n)\n\ntype DiscRec struct {\n\tDrItem string\n\tDrPrice decimal.Decimal\n\tDrPct int64\n}\n\nvar WsEofFlag string = \"N\"\nvar WsDiscount decimal.Decimal = decimal.NewFromInt(0)\nvar WsNet decimal.Decimal = decimal.NewFromInt(0)\nvar WsTotalNet decimal.Decimal = decimal.NewFromInt(0)\nvar WsCount int64 = 0\nvar WsPriceEd string\nvar WsDiscEd string\nvar WsNetEd str s.Stderr, \"open input.dat: %v\\n\", err)\n\t\tos.Exit(1)\n\t}\n\tdefer f.Close()\n\tscanner := bufio.NewScanner(f)\n\t// preserve trailing spaces: Scanner strips newline but keeps spaces; need to allow long lines\n\t// increase buffer\n\tbuf := make([]byte, 0, 64*1024)\n\tscanner.Buffer(buf, 10*1024*1024)\n\tinputLines = []string{}\n\tfor scanner.Scan() {\n\t\t// scanner.Text() returns line without newline; keep as is\n\t\t// Need to handle \\r for Windows line endings: scanner already strips, but we also strip \\r if present\n\t\ttxt := scanner.Text()\n\t\t// Scanner's Split already handles \\r, but just in case\n\t\tinputLines = append(inputLines, txt)\n\t}\n\tif err := scanner.Err(); err != nil {\n\t\tfmt.Fprintf(os.Stderr, \"read input.dat: %v\\n\", err)\n\t\tos.Exit(1)\n\t}\n\tinputIdx = 0\n\tWsEofFlag = \"N\"\n\tinputDone = false\n\tWsDiscount = decimal.New(0, -2)\n\tWsNet = decimal.New(0, -2)\n\tWsTotalNet = decimal.New(0, -2)\n\tWsCount = 0\n\n\tReadPara()\n\tfor !inputDone {\n\t\tProcessPara()\n\t}\n\t// CLOSE DISC-FILE already deferred\n\tSummaryPara()\n}\n\nfunc main() {\n\tMainPara()\n}\n"}, "cobol": "      * DISCOUNT CALCULATION (tier 1)\n      * Record (15 bytes): ITEM X(6) | PRICE 9(5)V99 | PCT 9(2)\n      * Discount is rounded to cents; net = price - discount.\n       IDENTIFICATION DIVISION.\n       PROGRAM-ID. DISCCALC.\n\n       ENVIRONMENT DIVISION.\n       INPUT-OUTPUT SECTION.\n       FILE-CONTROL.\n           SELECT DISC-FILE ASSIGN TO \"input.dat\"\n               ORGANIZATION IS LINE SEQUENTIAL.\n\n       DATA DIVISION.\n       FILE SECTION.\n       FD  DISC-FILE.\n       01  DISC-REC.\n           05 DR-ITEM        PIC X(6).\n           05 DR-PRICE       PIC 9(5)V99.\n           05 DR-PCT         PIC 9(2).\n\n       WORKING-STORAGE SECTION.\n       01  WS-EOF-FLAG       PIC X        VALUE \"N\".\n           88 INPUT-DONE                  VALUE \"Y\".\n       01  WS-DISCOUNT       PIC 9(5)V99  VALUE 0.\n       01  WS-NET            PIC 9(5)V99  VALUE 0.\n       01  WS-TOTAL-NET      PIC 9(8)V99  VALUE 0.\n       01  WS-COUNT          PIC 9(3)     VALUE 0.\n       01  WS-PRICE-ED       PIC ZZ,ZZ9.99.\n       01  WS-DISC-ED        PIC ZZ,ZZ9.99.\n       01  WS-NET-ED         PIC ZZ,ZZ9.99.\n       01  WS-TOTAL-ED       PIC ZZ,ZZZ,ZZ9.99.\n\n       PROCEDURE DIVISION.\n       MAIN-PARA.\n           OPEN INPUT DISC-FILE\n           PERFORM READ-PARA\n           PERFORM PROCESS-PARA UNTIL INPUT-DONE\n           CLOSE DISC-FILE\n           PERFORM SUMMARY-PARA\n           STOP RUN.\n\n       READ-PARA.\n           READ DISC-FILE\n               AT END SET INPUT-DONE TO TRUE\n           END-READ.\n\n       PROCESS-PARA.\n           COMPUTE WS-DISCOUNT ROUNDED = DR-PRICE * DR-PCT / 100\n           COMPUTE WS-NET = DR-PRICE - WS-DISCOUNT\n           ADD WS-NET TO WS-TOTAL-NET\n           ADD 1 TO WS-COUNT\n           MOVE DR-PRICE TO WS-PRICE-ED\n           MOVE WS-DISCOUNT TO WS-DISC-ED\n           MOVE WS-NET TO WS-NET-ED\n           DISPLAY DR-ITEM \" \" WS-PRICE-ED \" \" DR-PCT \"% \"\n               WS-DISC-ED \" \" WS-NET-ED\n           PERFORM READ-PARA.\n\n       SUMMARY-PARA.\n           MOVE WS-TOTAL-NET TO WS-TOTAL-ED\n           DISPLAY \"ITEMS: \" WS-COUNT \" NET TOTAL: \" WS-TOTAL-ED."}, {"program": "payroll_report", "provider": "modal", "model": "mihirpanchal2603--ep-muse-spark-open-816b-a42b-server.us-west.modal.direct", "effort": "default", "sample": 0, "status": "verified", "single_shot_ok": true, "repairs_used": 0, "attempts": [{"n": 0, "kind": "translate", "cost_usd": 0.02742075, "cached": false, "output_tokens": 5754, "built": true, "passed_cases": 5, "failure": ""}], "total_cost_usd": 0.027421, "risk_features": ["EDITED-OUTPUT", "EVALUATE", "ROUNDED"], "warnings": [], "cases": 5, "attempt_go": {"attempt_0.go": "package main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\t\"strings\"\n\n\t\"github.com/shopspring/decimal\"\n)\n\ntype EmpRec struct {\n\tErId    string\n\tErDept  string\n\tEr t(\" \", 17-len(line))\n\t} else if len(line) > 17 {\n\t\tline = line[:17]\n\t}\n\treturn line, true\n}\n\nfunc parseEmpRec(line string) EmpRec {\n\terId := line[0:5]\n\terDept := line[5:8]\n\thoursStr := line[8:12]\n\trateStr := line[12:17]\n\n\thoursDigits := int64(0)\n\tfmt.Sscanf(hoursStr, \"%d\", &hoursDigits) // but hoursStr may have leading zeros and spaces? Actually digits only\n\t// Safer: parse manually\n\thoursDigits = 0\n\tfor _, ch := range hoursStr {\n\t\tif ch >= '0' && ch <= '9' {\n\t\t\thoursDigits = hoursDigits*10 + int64(ch-'0')\n\t\t} else if ch == ' ' {\n\t\t\thoursDigits = hoursDigits * 10\n\t\t}\n\t}\n\trateDigits := int64(0)\n\tfor _, ch := range rateStr {\n\t\tif ch >= '0' && ch <= '9' {\n\t\t\trateDigits = rateDigits*10 + int64(ch-'0')\n\t\t} else if ch == ' ' {\n\t\t\trateDigits = rateDigits * 10\n\t\t}\n\t}\n\t// Use decimal.New(n, -scale)\n\terHours := decimal.New(hoursDigits, -1)\n\terRate := decimal.New(rateDigits, -2)\n\treturn EmpRec{\n\t\tErId:    erId,\n\t\tErDept:  erDept,\n\t\tErHours: erHours,\n\t\tErRate:  erRate,\n\t}\n}\n\nfunc MAINPARA() {\n\t// OPEN INPUT EMP-FILE\n\tvar err error\n\tempFile, err = os.Open(\"input.dat\")\n\tif err != nil {\n\t\t// If file does not exist, treat as empty\n\t\tempFile = nil\n\t\tempReader = bufio.NewScanner(strings.NewReader(\"\"))\n\t} else {\n\t\tempReader = bufio.NewScanner(empFile)\n\t}\n\tREADPARA()\n\tfor !wsEofFlagInternal {\n\t\tPROCESSPARA()\n\t}\n\tif WsFirstFlag != \"Y\" { // NOT FIRST-RECORD\n\t\tDEPTBREAKPARA()\n\t}\n\tif empFile != nil {\n\t\tempFile.Close()\n\t}\n\tGRANDPARA()\n}\n\nfunc READPARA() {\n\tline, ok := readEmpLine()\n\tif !ok {\n\t\twsEofFlagInternal = true\n\t\tWsEofFlag = \"Y\"\n\t\treturn\n\t}\n\tempRec = parseEmpRec(line)\n}\n\nfunc PROCESSPARA() {\n\tif WsFirstFlag == \"Y\" {\n\t\tWsPrevDept = empRec.ErDept\n\t\tWsFirstFlag = \"N\"\n\t} else {\n\t\tif empRec.ErDept != WsPrevDept {\n\t\t\tDEPTBREAKPARA()\n\t\t\tWsPrevDept = empRec.ErDept\n\t\t}\n\t}\n\tPAYPARA() \t\t// there is only 9 in spec\n\t\t\t\t// map to fracStr sequentially\n\t\t\t\t// placeholder order for fraction is direct\n\t\t\t\t// count placeholders up to i\n\t\t\t\tcnt := 0\n\t\t\t\tfor j := 0; j < i; j++ {\n\t\t\t\t\tif fracPic[j] == 'Z' || fracPic[j] == '9' {\n\t\t\t\t\t\tcnt++\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\t// cnt is index in fracStr\n\t\t\t\tif cnt < len(fracStr) {\n\t\t\t\t\tfracResult[i] = fracStr[cnt]\n\t\t\t\t} else {\n\t\t\t\t\tfracResult[i] = '0'\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tfracResult[i] = c\n\t\t\t}\n\t\t}\n\t}\n\n\tvar final string\n\tif dotIdx != -1 {\n\t\tfinal = string(intResult) + \".\" + string(fracResult)\n\t} else {\n\t\tfinal = string(intResult)\n\t}\n\t// handle negative sign: if original negative, put '-' at last suppressed space? For this program no negatives needed.\n\tif isNeg {\n\t\t// place minus in front of first non-space digit\n\t\t// find first non-space in final\n\t\tfor i, ch := range final {\n\t\t\tif ch != ' ' && ch != ',' && ch != '.' {\n\t\t\t\t// replace preceding space with '-' if possible, else prepend\n\t\t\t\tif i > 0 && final[i-1] == ' ' {\n\t\t\t\t\tb := []byte(final)\n\t\t\t\t\tb[i-1] = '-'\n\t\t\t\t\tfinal = string(b)\n\t\t\t\t} else {\n\t\t\t\t\tfinal = \"-\" + final\n\t\t\t\t}\n\t\t\t\tbreak\n\t\t\t}\n\t\t}\n\t}\n\treturn final\n}\n\nfunc parseDecimalField(s string, scale int32) decimal.Decimal {\n\ts = strings.TrimSpace(s)\n\tif s == \"\" {\n\t\treturn decimal.New(0, 0)\n\t}\n\t// s contains digits only, possibly with sign\n\t// handle sign\n\tneg := false\n\tif strings.HasPrefix(s, \"-\") {\n\t\tneg = true\n\t\ts = s[1:]\n\t} else if strings.HasPrefix(s, \"+\") {\n\t\ts = s[1:]\n\t}\n\t// remove spaces\n\ts = strings.ReplaceAll(s, \" \", \"\")\n\tif s == \"\" {\n\t\treturn decimal.New(0, 0)\n\t}\n\t// parse as integer\n\td, err := decimal.NewFromString(s)\n\tif err != nil {\n\t\t// fallback to 0\n\t\treturn decimal.New(0, 0)\n\t}\n\td = d.Shift(-scale)\n\tif neg {\n\t\td = d.Neg()\n\t}\n\treturn d\n}\n\nfunc parseIntField(s string) int64 {\n\ts = strings.TrimSpace(s)\n\tif s == \"\" {\n\t\treturn 0\n\t}\n\tvar v int64\n\tfmt.Sscanf(s, \"%d\", &v)\n\treturn v\n}\n\nfunc readPara() {\n\tline, err := loanReader.ReadString('\\n')\n\tif err != nil {\n\t\t// if we got some data before EOF, process it; otherwise set EOF\n\t\tif len(line) == 0 {\n\t\t\tWsEofFlag = \"Y\"\n\t\t\treturn\n\t\t}\n\t\t// partial line without newline at EOF still counts\n\t}\n\t// Remove trailing \\r and \\n\n\tline = strings.TrimRight(line, \"\\r\\n\")\n\t// pad with spaces on right to 21\n\tif len(line) < 21 {\n\t\tline = line + strings.Repeat(\" \", 21-len(line))\n\t} else if len(line) > 21 {\n\t\tline = line[:21]\n\t}\n\tloanRec.LrAcct = line[0:6]\n\tloanRec.LrPrincipal = parseDecimalField(line[6:15], 2)\n\tloanRec.LrRate = parseDecimalField(line[15:19], 2)\n\tloanRec.LrYears = parseIntField(line[19:21])\n}\n\nfunc processPara() {\n\t// COMPUTE WS-INTEREST ROUNDED = LR-PRINCIPAL * LR-RATE * LR-YEARS / 100\n\tyearsDec := decimal.NewFromInt(loanRec.LrYears)\n\tcalc := loanRec.LrPrincipal.Mul(loanRec.LrRate).Mul(yearsDec).Shift(-2)\n\trounded := calc.Round(2)\n\tWsInterest = storeDecimal(rounded, 9, 2)\n\n\tWsTotal = WsTotal.Add(WsInterest)\n\tWsTotal = storeDecimal(WsTotal, 11, 2)\n\n\tWsCount++\n\t// keep low-order digits for 9(5)\n\tif WsCount >= 100000 {\n\t\tWsCount = WsCount % 100000\n\t}\n\n\tWsPrinEd = formatEdited(loanRec.LrPrincipal, \"Z,ZZZ,ZZ9.99\")\n\tWsIntEd = formatEdited(WsInterest, \"ZZZ,ZZZ,ZZ9.99\")\n\t// DISPLAY LR-ACCT \" \" WS-PRIN-ED \" \" WS-INT-ED\n\t// LR-ACCT is X(6) exactly 6 chars\n\tfmt.Printf(\"%s %s %s\\n\", loanRec.LrAcct, WsPrinEd, WsIntEd)\n\n\treadPara()\n}\n\nfunc summaryPara() {\n\tWsTotalEd = formatEdited(WsTotal, \"ZZ,ZZZ,ZZZ,ZZ9.99\")\n\t// WS-COUNT is PIC 9(5) zero padded\n\tcountStr := fmt.Sprintf(\"%05d\", WsCount)\n\tfmt.Printf(\"RECORDS: %s\\n\", countStr)\n\tfmt.Printf(\"TOTAL INTEREST: %s\\n\", WsTotalEd)\n}\n\nfunc mainPara() {\n\tvar err error\n\tloanFile, err = os.Open(\"input.dat\")\n\tif err != nil {\n\t\tfmt.Fprintf(os.Stderr, \"open input.dat: %v\\n\", err)\n\t\tos.Exit(1)\n\t}\n\tdefer loanFile.Close()\n\tloanReader = bufio.NewReader(loanFile)\n\n\treadPara()\n\tfor WsEofFlag != \"Y\" {\n\t\tprocessPara()\n\t}\n\tloanFile.Close()\n\tsummaryPara()\n}\n\nfunc main() {\n\tmainPara()\n}\n"}, "cobol": "      * SIMPLE-INTEREST BATCH (tier 1)\n      * Reads fixed-width loan records from input.dat and prints one\n      * line per loan plus a summary. Written for this hackathon.\n      * Record layout (21 bytes): ACCT X(6) | PRINCIPAL 9(7)V99 |\n      *                           RATE 9(2)V99 (percent) | YEARS 9(2)\n       IDENTIFICATION DIVISION.\n       PROGRAM-ID. SIMPLEINT.\n\n       ENVIRONMENT DIVISION.\n       INPUT-OUTPUT SECTION.\n       FILE-CONTROL.\n           SELECT LOAN-FILE ASSIGN TO \"input.dat\"\n               ORGANIZATION IS LINE SEQUENTIAL.\n\n       DATA DIVISION.\n       FILE SECTION.\n       FD  LOAN-FILE.\n       01  LOAN-REC.\n           05 LR-ACCT        PIC X(6).\n           05 LR-PRINCIPAL   PIC 9(7)V99.\n           05 LR-RATE        PIC 9(2)V99.\n           05 LR-YEARS       PIC 9(2).\n\n       WORKING-STORAGE SECTION.\n       01  WS-EOF-FLAG       PIC X       VALUE \"N\".\n           88 INPUT-DONE                 VALUE \"Y\".\n       01  WS-INTEREST       PIC 9(9)V99 VALUE 0.\n       01  WS-TOTAL          PIC 9(11)V99 VALUE 0.\n       01  WS-COUNT          PIC 9(5)    VALUE 0.\n       01  WS-PRIN-ED        PIC Z,ZZZ,ZZ9.99.\n       01  WS-INT-ED         PIC ZZZ,ZZZ,ZZ9.99.\n       01  WS-TOTAL-ED       PIC ZZ,ZZZ,ZZZ,ZZ9.99.\n\n       PROCEDURE DIVISION.\n       MAIN-PARA.\n           OPEN INPUT LOAN-FILE\n           PERFORM READ-PARA\n           PERFORM PROCESS-PARA UNTIL INPUT-DONE\n           CLOSE LOAN-FILE\n           PERFORM SUMMARY-PARA\n           STOP RUN.\n\n       READ-PARA.\n           READ LOAN-FILE\n               AT END SET INPUT-DONE TO TRUE\n           END-READ.\n\n       PROCESS-PARA.\n           COMPUTE WS-INTEREST ROUNDED =\n               LR-PRINCIPAL * LR-RATE * LR-YEARS / 100\n           ADD WS-INTEREST TO WS-TOTAL\n           ADD 1 TO WS-COUNT\n           MOVE LR-PRINCIPAL TO WS-PRIN-ED\n           MOVE WS-INTEREST TO WS-INT-ED\n           DISPLAY LR-ACCT \" \" WS-PRIN-ED \" \" WS-INT-ED\n           PERFORM READ-PARA.\n\n       SUMMARY-PARA.\n           MOVE WS-TOTAL TO WS-TOTAL-ED\n           DISPLAY \"RECORDS: \" WS-COUNT\n           DISPLAY \"TOTAL INTEREST: \" WS-TOTAL-ED.\n           "}], "summary": [{"provider": "baseten", "model": "meta-models/muse-spark-open-1026", "effort": "default", "program": "simple_interest", "runs": 1, "single_shot": "1/1", "verified": "1/1", "avg_repairs": 0.0, "avg_out_tokens": 28851, "errors": 0, "avg_list_cost_usd": 0.123, "total_cost_usd": 0.123}, {"provider": "meta", "model": "muse-spark-1.3", "effort": "default", "program": "discount_calc", "runs": 3, "single_shot": "3/3", "verified": "3/3", "avg_repairs": 0.0, "avg_out_tokens": 7098, "errors": 0, "avg_list_cost_usd": 0.0316, "total_cost_usd": 0.0949}, {"provider": "meta", "model": "muse-spark-1.3", "effort": "default", "program": "simple_interest", "runs": 2, "single_shot": "1/2", "verified": "2/2", "avg_repairs": 0.5, "avg_out_tokens": 7865, "errors": 0, "avg_list_cost_usd": 0.0362, "total_cost_usd": 0.0725}, {"provider": "meta", "model": "muse-spark-1.3", "effort": "low", "program": "simple_interest", "runs": 1, "single_shot": "1/1", "verified": "1/1", "avg_repairs": 0.0, "avg_out_tokens": 7105, "errors": 0, "avg_list_cost_usd": 0.0, "total_cost_usd": 0.0}, {"provider": "modal", "model": "mihirpanchal2603--ep-muse-spark-open-816b-a42b-server.us-west.modal.direct", "effort": "default", "program": "discount_calc", "runs": 3, "single_shot": "2/3", "verified": "3/3", "avg_repairs": 0.33, "avg_out_tokens": 8754, "errors": 0, "avg_list_cost_usd": 0.0414, "total_cost_usd": 0.1243}, {"provider": "modal", "model": "mihirpanchal2603     <script>
        const D = JSON.parse(document.getElementById('data').textContent);

        const fmt = v => Number(v ?? 0).toFixed(4);
        function table(rows, keys) {
            const t = el('table'), h = el('tr'); keys.forEach(k => h.append(el('th', '', k))); t.append(h);
            rows.forEach(r => { const tr = el('tr'); keys.forEach(k => tr.append(el('td', '', String(r[k] ?? '')))); t.append(tr) }); return t
        }
        document.getElementById('sum').append(table(D.summary, ['provider', 'program', 'effort', 'runs', 'single_shot', 'verified', 'errors', 'avg_repairs', 'avg_out_tokens', 'avg_list_cost_usd', 'total_cost_usd']));
        const runsDiv = document.getElementById('runs');
        function show(i) {
            [...runsDiv.children].forEach((b, j) => b.classList.toggle('on', i === j));
            const r = D.runs[i], d = document.getElementById('detail'); d.replaceChildren();
            d.append(el('h2', '', `${r.provider} · ${r.program} · sample ${r.sample}`));
            d.append(el('p', '', el('b', r.status === 'verified' ? 'ok' : 'bad', String(r.status)), ` · first attempt ${r.single_shot_ok ? 'passed' : 'failed'} · repairs ${r.repairs_used} · list cost $${fmt(r.total_list_cost_usd ?? r.total_cost_usd)} · ${r.model}`));
            const rows = r.attempts.map(a => ({ attempt: a.kind, built: a.built, passed: `${a.passed_cases}/${r.cases}`, out_tokens: a.output_tokens, cost: fmt(a.list_cost_usd ?? a.cost_usd) }));
            d.append(el('div', 'wrap', table(rows, ['attempt', 'built', 'passed', 'out_tokens', 'cost'])));
            r.attempts.filter(a => a.failure).forEach(a => d.append(el('h2', '', `Why ${a.kind} failed`), el('pre', '', a.failure)));
            const names = Object.keys(r.attempt_go), sel = el('select'), go = el('pre');
            names.forEach(n => sel.append(new Option(n, n)));
            const setGo = () => { go.textContent = r.attempt_go[sel.value] ?? r.final_go ?? '' };
            if (names.length) sel.value = names[names.length - 1]; sel.onchange = setGo; setGo();
            d.append(el('h2', '', 'Source and translation'), el('div', 'cols', el('div', '', el('p', 'mut', 'COBOL (original)'), el('pre', '', r.cobol)), el('div', '', el('p', 'mut', 'Go: ', sel), go)))
        }
        D.runs.forEach((r, i) => { const b = el('button', '', `${r.provider}/${r.program}/s${r.sample}` + (r.status === 'verified' ? '' : ' ✗')); b.onclick = () => show(i); runsDiv.append(b) });
        D.runs.length ? show(0) : document.getElementById('detail').append('No results found in run/.');
